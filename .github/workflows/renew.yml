name: Auto Renew Zampto

on:
  schedule:
    # Chạy mỗi 45 phút (Zampto yêu cầu dưới 60 phút)
    - cron: '*/45 * * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
      - name: Run Renew Script
        run: python renew.py
