name: Zampto Server Auto Renew

on:
  schedule:
    # Chạy mỗi 35 phút để đảm bảo không quá hạn 1 tiếng và tiết kiệm quota
    - cron: '*/35 * * * *'
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công để test

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Renew Script
        env:
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
          ZAMPTO_COOKIE: ${{ secrets.ZAMPTO_COOKIE }}
          ZAMPTO_SERVER_ID: ${{ secrets.ZAMPTO_SERVER_ID }}
        run: python renew.py
